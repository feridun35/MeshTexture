name: Deploy to Vercel

on:
  push:
    branches:
      - main
      - master

# The job only needs to read the repository.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change what runs here.
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # Installs the exact versions from package-lock.json (integrity-checked),
      # including the pinned javascript-obfuscator.
      - name: Install dependencies
        run: npm ci

      # Obfuscates, copies assets and vendor/three, rewrites paths in index.html
      # and generates dist/vercel.json with the security headers.
      - name: Build dist
        run: npm run build:dist

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@62.0.0 deploy ./dist --prod --yes
